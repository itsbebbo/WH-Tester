; Arm/Fire Circuit Functional Tester -- M5Stack CoreS3
; See README.md for the wiring table and the feature flags in src/config.h.

[platformio]
; Keep build output and libraries off Google Drive
workspace_dir   = C:/pio/workspaces/WH Tester
build_cache_dir = C:/pio/.cache/build

[env:m5stack-cores3]
platform      = espressif32@6.13.0
board         = m5stack-cores3
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

board_build.partitions = default_16MB.csv

lib_deps =
    m5stack/M5Unified@^0.2.5
    lvgl/lvgl@^8.3.11

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -I include
    -I src
    -Wall
